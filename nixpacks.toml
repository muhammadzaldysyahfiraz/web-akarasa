[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "php84Extensions.pdo_pgsql", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "NODE_OPTIONS='--max-old-space-size=512' npm ci --no-audit --no-fund --prefer-offline"
]

[phases.build]
cmds = [
    "NODE_OPTIONS='--max-old-space-size=512' npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan optimize && php artisan serve --host=0.0.0.0 --port=$PORT"